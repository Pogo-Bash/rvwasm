<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- (Natively the Debian disk is /debian, inside the chroot it is /: every path is given both ways, the one that is not there is skipped.)
     The nqs disk's fontconfig: the Debian disk's fonts and its aliases, nothing of this disk's own. The native system has no
     /usr/share/fonts and no /etc/fonts; the cache goes to memory.
     The Debian disk's /etc/fonts/conf.d is a directory of symbolic links, many of them absolute (/usr/share/fontconfig/conf.avail/...):
     here those would point at nothing, so the files of conf.d are named one by one, in conf.d's order, with the /debian prefix
     (30-metric-aliases: Helvetica and Times to Nimbus Sans and Roman, the fonts of urw-base35 that the disk has). -->
<fontconfig>
	<dir>/debian/usr/share/fonts</dir>
	<dir>/usr/share/fonts</dir>
	<cachedir>/tmp/fontconfig</cachedir>
	<include ignore_missing="yes">/debian/usr/share/fontconfig/conf.avail/10-hinting-slight.conf</include>
	<include ignore_missing="yes">/usr/share/fontconfig/conf.avail/10-hinting-slight.conf</include>
