<!doctype html>
<!--
  Blender for the browser (Puter's build: blender.wasm with a WebGPU backend), as a window of the machine's
  desktop. This page is served from another origin than the machine's page (blenderweb/serve.py), so that the
  browser gives it a process of its own, and the machine's page shows it in an iframe over the window that
  /run/wlserver/blenderweb/blender-gpu made (blenderweb/README.md). Nothing here loads from outside this
  computer.

  Blender and Puter's build are under the GNU GPL (version 2 or later); release/SOURCE.txt says where the
  source of the build served here is. main.js is Puter's demo/src/main.js, changed: see its header.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blender</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #303030; color: #ccc;
      font: 13px/1.4 "Noto Sans", "DejaVu Sans", system-ui, sans-serif; }
    #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; outline: none;
      background: #181818; touch-action: none; overscroll-behavior: none; user-select: none;
      -webkit-user-select: none; visibility: hidden; }
    #canvas.ready { visibility: visible; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; background: #303030; }
    #splash.done { display: none; }
    #splash h1 { font-size: 15px; font-weight: 600; margin: 0; color: #e6e6e6; }
    .track { width: min(360px, 70vw); height: 4px; background: #1d1d1d; border-radius: 2px; overflow: hidden; }
    .fill { height: 100%; width: 0; background: #e87d0d; transition: width .15s; }
    #status { min-height: 1.4em; color: #aaa; text-align: center; max-width: 80vw; }
    #status.error { color: #ff8a65; }
    #log { width: min(640px, 90vw); height: 120px; overflow: auto; font: 11px/1.35 monospace; color: #888;
      background: #262626; padding: 6px 8px; box-sizing: border-box; border-radius: 3px; white-space: pre-wrap; }
    #ask { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, .45); z-index: 10; }
    #ask.shown { display: flex; }
    #ask .box { background: #3d3d3d; border: 1px solid #222; border-radius: 6px; padding: 16px 18px;
      max-width: 340px; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); }
    #ask p { margin: 0 0 14px; color: #ddd; }
    #ask .buttons { display: flex; justify-content: flex-end; gap: 8px; }
    #ask button { font: inherit; color: #ddd; background: #545454; border: 1px solid #2a2a2a;
      border-radius: 3px; padding: 4px 14px; cursor: pointer; }
    #ask button.danger { background: #a3442b; }
  </style>
</head>
<body>
  <section id="splash">
    <h1>Blender</h1>
    <div class="track"><div id="fill" class="fill"></div></div>
    <div id="status">Loading…</div>
    <div id="log"></div>
  </section>
  <canvas id="canvas" width="800" height="600" tabindex="0"></canvas>
  <div id="ask"><div class="box">
    <p>Close Blender? What is not saved is lost.</p>
    <div class="buttons"><button id="ask-no">Cancel</button><button id="ask-yes" class="danger">Close</button></div>
  </div></div>
  <script type="module" src="main.js"></script>
</body>
</html>
