# X on the Linux/Wasm display: the frame buffer the page shows, and the
# keyboard and pointer the page feeds (tools/patch-runtime.py). Nothing is
# discovered at run time (there is no udev): the two input devices are named.

Section "ServerFlags"
	Option "AutoAddDevices" "false"
	Option "AutoEnableDevices" "false"
	Option "DontVTSwitch" "true"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
EndSection

Section "Module"
	Disable "glx"
	Disable "dri"
	Disable "dri2"
	Disable "dri3"
	Disable "glamoregl"
EndSection

Section "Device"
	Identifier "display"
	Driver "fbdev"
	Option "fbdev" "/dev/fb0"
EndSection

Section "Screen"
	Identifier "screen"
	Device "display"
	DefaultDepth 24
EndSection

Section "InputDevice"
	Identifier "keyboard"
	Driver "evdev"
	Option "Device" "/dev/input/event0"
EndSection

Section "InputDevice"
	Identifier "pointer"
	Driver "evdev"
	Option "Device" "/dev/input/event1"
EndSection

Section "ServerLayout"
	Identifier "layout"
	Screen "screen"
	InputDevice "keyboard" "CoreKeyboard"
	InputDevice "pointer" "CorePointer"
EndSection
