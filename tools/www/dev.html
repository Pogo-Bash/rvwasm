<!DOCTYPE html>
<!--
  Development page for the Linux/Wasm system: the upstream page plus a small
  scripting interface, so that tests can run commands without typing into the
  terminal emulator.

    await linuxReady                      resolves once the shell prompt appears
    await linuxRun("command", timeoutMs)  -> { rc, out }  (out without the echoed command)
    linuxType("text")                     types it, and does not wait

  Served next to linux.js, linux-worker.js, xterm.js and the kernel/initramfs.
-->
<head>
  <meta charset="utf-8">
  <title>rvwasm: KDE Plasma on the web</title>
  <!-- This is the machine itself (served as /desktop on the public site); the landing page at / is the one for search
       engines, so this one is not indexed (the server also sends X-Robots-Tag: noindex). -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="xterm.css">
  <!-- The landing page's font (the bar above the display is set in it too). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    /* The relay's note that this machine waits for the network (netBanner below): outside the machine's canvas, over the
       bottom edge of the page, small, and out of the way of the mouse. Catppuccin Mocha. */
    #netbanner {
      position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 40000;
      max-width: min(92vw, 90ch); box-sizing: border-box; padding: 5px 12px; border-radius: 6px;
      background: #1e1e2e; color: #cdd6f4; border: 1px solid #45475a; border-left: 3px solid #f9e2af;
      font: 12px/1.45 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      pointer-events: none; opacity: .94;
    }
    #netbanner[hidden] { display: none; }
    /* The note that the browser took the site's storage away (storageNote below): a persistent one, over the bottom edge
       of the page like the relay's, with a button; it is the one place a person is told that their files are not kept. */
    #storagenote {
      position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 40001;
      max-width: min(94vw, 100ch); box-sizing: border-box; padding: 8px 12px; border-radius: 6px;
      background: #1e1e2e; color: #cdd6f4; border: 1px solid #45475a; border-left: 4px solid #f38ba8;
      font: 12px/1.5 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display: flex; gap: 12px; align-items: flex-start;
    }
    #storagenote[hidden] { display: none; }
    #storagenote button {
      flex: none; font: inherit; color: inherit; background: #313244; border: 1px solid #45475a; border-radius: 4px;
      padding: 2px 8px; cursor: pointer;
    }
    /* What a program that is slow to start is doing (launchNote below), in the bar above the machine's display (display.js makes
       #launchnote there, at the bar's right end): not over the display. Catppuccin Mocha and JetBrains Mono, as the landing page. */
    #launchnote {
      display: flex; align-items: center; justify-content: flex-end; gap: 14px; min-width: 0; margin-left: auto;
      flex: 0 1 auto; overflow: hidden; white-space: nowrap; font: inherit; color: #bac2de;
    }
    #launchnote[hidden] { display: none; }
    #launchnote .ln { display: flex; align-items: center; gap: 7px; min-width: 0; transition: opacity .6s ease; }
    #launchnote .ln-main { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    #launchnote .ln-more { flex: 0 1000 auto; color: #7f849c; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    #launchnote .ln-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: #cba6f7; }
    #launchnote .ln-start .ln-dot { animation: ln-pulse 1.2s ease-in-out infinite; }
    #launchnote .ln-done .ln-dot { background: #a6e3a1; }
    #launchnote .ln-done { color: #a6e3a1; }
    #launchnote .ln-fail { color: #f38ba8; }
    #launchnote .ln-fail .ln-dot { background: #f38ba8; }
    #launchnote .ln-fade { opacity: 0; }
    #launchnote [hidden] { display: none; }
    @keyframes ln-pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { #launchnote .ln-start .ln-dot { animation: none; } #launchnote .ln { transition: none; } }
  </style>
  <script>
    // The relay shares the network of one public address between the machines behind it (campus and public wifi have
    // many people on one): a machine beyond the limit waits until someone goes idle. The relay says so in a TEXT
    // message on the WebSocket (the Ethernet frames are binary ones): {"type":"net-state","state":"active"|"waiting",
    // "others":N,"queue":Q,"waiting":W,"cap":C}. This page shows it in #netbanner, outside the machine's display, and
    // keeps those messages from the machine (linux.js hands every message to the kernel as a frame). Nothing is
    // added inside the machine. Only the socket that asked for them (&ctl=1 in its URL) is looked at.
    (() => {
      const RealWebSocket = window.WebSocket;
      const show = (text) => {
        const el = document.getElementById("netbanner");
        if (el) {
          el.textContent = text || "";
          el.hidden = !text;
        }
      };
      const count = (value) => Math.max(0, Math.min(1e6, Math.floor(Number(value)) || 0));
      window.netBanner = (message) => {
        if (!message || message.type != "net-state") {
          return;
        }
        const others = count(message.others), queue = count(message.queue), waiting = count(message.waiting);
        if (message.state == "waiting") {
          const text = "rvRelay in use by " + others + " other" + (others == 1 ? "" : "s")
            + " on your network (shared IP). waiting for a free slot, "
            + (queue <= 1 ? "you're next" : "place " + queue + " of " + waiting + " in line")
            + "; it switches automatically when someone goes idle.";
          console.log("[net] " + text);
          show(text);
        } else {
          console.log("[net] rvRelay: this machine has the network (" + others + " other"
                      + (others == 1 ? "" : "s") + " on your network)");
          show("");
        }
      };
      window.WebSocket = class extends RealWebSocket {
        constructor(url, ...rest) {
          super(url, ...rest);
          if (/[?&]ctl=1(&|$)/.test(String(url))) {
            // (Added before linux.js sets onmessage, so it runs first and keeps text from the kernel's frame ring.)
            this.addEventListener("message", (event) => {
              if (typeof event.data == "string") {
                event.stopImmediatePropagation();
                try {
                  window.netBanner(JSON.parse(event.data));
                } catch (error) {
                }
              }
            });
            this.addEventListener("close", () => show(""));
          }
        }
      };
    })();
  </script>
  <script>
    // A program started from Plasma's launcher or panel has no window for a while when it is the first of the visit to need its libraries
    // (native programs: the libraries are fetched from the server and prepared by the browser, a minute or two on a slow connection), and
    // Plasma's own launch feedback (the busy cursor, the task button) used to end after 20 s: a program that was still on its way looked as
    // if it had quit. The window server tells the page about every launch with an app id (wlserver/plasmashell.js: rv-plasma "launch",
    // "launch-done", and it keeps Plasma's feedback up for five minutes). The page says what is going on from the sixth second on, in the
    // bar above the display (not over it): the program, the time, how many libraries its Workers have loaded since, and, if the tab is
    // hidden, the tab's title (a hidden tab's timers and frames are slowed down by the browser: it should be in front while a program
    // starts); when the program is up, "Launched ... (57 s)" for a few seconds.
    (() => {
      const NAMES = { systemsettings: "System Settings", kcalc: "KCalc", kwrite: "KWrite", kate: "Kate", konsole: "Konsole",
                      dolphin: "Dolphin", okular: "Okular", gwenview: "Gwenview", ark: "Ark" };
      const SHOW_AFTER_MS = 6000, GIVE_UP_MS = 300000;
      const pending = new Map();
      let timer = 0, title0 = null;
      const nameOf = (appId) => {
        const base = String(appId).replace(/^org\.kde\./, "").replace(/\.desktop$/, "");
        return NAMES[base.toLowerCase()] || base.charAt(0).toUpperCase() + base.slice(1);
      };
      const windowsOf = (appId) => {
        const d = window.rvDisplay;
        try {
          return d && d.windows ? d.windows().filter((w) => w.kind === 1 && (w.appId || "").toLowerCase() === appId.toLowerCase()).length : 0;
        } catch (error) {
          return 0;
        }
      };
      const libs = (since) => {
        const log = window.linuxOs && window.linuxOs.dl && window.linuxOs.dl.log;
        if (!log) {
          return null;
        }
        const seen = new Set();
        let bytes = 0;
        for (let i = log.length - 1; i >= 0 && i >= since; i--) {
          if (log[i].runner !== "main" && log[i].size && !seen.has(log[i].key)) {
            seen.add(log[i].key);
            bytes += log[i].size;
          }
        }
        return { n: seen.size, mib: Math.round(bytes / 1048576) };
      };
      // What the bar says. While programs start: "Starting Kate... 17 s" and, if it fits, how many libraries are in; when one is up:
      // "Launched Kate (57 s)", a few seconds, then it fades. Several at once make one line each of the two kinds, not a pile: at
      // most two names, then "+N"; the time is the oldest launch's.
      const DONE_SHOW_MS = 4000, DONE_FADE_MS = 600, FAIL_SHOW_MS = 30000, MAX_NAMES = 2;
      const done = [];			// { name, secs } of the launches that finished lately (the last three)
      let doneFade = 0, doneClear = 0, doneFadeTimer = 0, failText = "", failTimer = 0;
      const names = (list) => list.slice(0, MAX_NAMES).join(", ") + (list.length > MAX_NAMES ? " +" + (list.length - MAX_NAMES) : "");
      const secs = (ms) => Math.round(ms / 1000);
      const part = (el, cls) => {
        let c = el.querySelector("." + cls);
        if (!c) {
          c = document.createElement("div");
          c.className = "ln " + cls;
          c.appendChild(Object.assign(document.createElement("span"), { className: "ln-dot" }));
          c.appendChild(Object.assign(document.createElement("span"), { className: "ln-main" }));
          c.appendChild(Object.assign(document.createElement("span"), { className: "ln-more" }));
          el.appendChild(c);
        }
        return c;
      };
      const setPart = (el, cls, main, more, title) => {
        const c = part(el, cls);
        c.hidden = !main;
        if (main) {
          c.querySelector(".ln-main").textContent = main;
          const m = c.querySelector(".ln-more");
          m.textContent = more || "";
          m.hidden = !more;
          c.title = title || "";
        }
        return c;
      };
      const render = () => {
        const el = document.getElementById("launchnote");
        if (!el) {
          return;
        }
        const now = performance.now();
        const shown = [...pending.values()].filter((p) => now - p.at >= SHOW_AFTER_MS).sort((a, b) => a.at - b.at);
        let main = "", more = "", title = "";
        if (shown.length) {
          const first = shown[0], l = libs(first.logAt);
          main = "Starting " + names(shown.map((p) => p.name)) + "\u2026 " + secs(now - first.at) + " s";
          more = l && l.n ? l.n + " libraries, " + l.mib + " MiB" : "";
          title = "A program's first start in a visit fetches its libraries and prepares them, a minute or two on a slow connection; " +
                  "it opens by itself. Keep this tab in front meanwhile.";
        }
        const start = setPart(el, "ln-start", main, more, title);
        const d = done.slice(-3);
        setPart(el, "ln-done", d.length ? "Launched " + names(d.map((x) => x.name + " (" + x.secs + " s)")) : "", "", "");
        el.querySelector(".ln-done").classList.toggle("ln-fade", doneFade === 2);
        setPart(el, "ln-fail", failText, "", failText);
        el.hidden = !(main || d.length || failText);
        // (the libraries only if they fit whole: no half a number)
        if (more && start.querySelector(".ln-more").scrollWidth > start.querySelector(".ln-more").clientWidth) {
          start.querySelector(".ln-more").hidden = true;
        }
      };
      const sayDone = (name, ms) => {
        done.push({ name, secs: secs(ms) });
        done.splice(0, Math.max(0, done.length - 3));
        doneFade = 1;
        clearTimeout(doneClear);
        clearTimeout(doneFadeTimer);
        doneFadeTimer = setTimeout(() => { doneFade = 2; render(); }, DONE_SHOW_MS - DONE_FADE_MS);
        doneClear = setTimeout(() => { done.length = 0; doneFade = 0; render(); }, DONE_SHOW_MS);
      };
      const finish = (appId, why, failed) => {
        const p = pending.get(appId);
        if (!p) {
          return;
        }
        pending.delete(appId);
        const ms = performance.now() - p.at;
        console.log("[Launch]: " + p.name + ": " + why + " after " + Math.round(ms / 100) / 10 + " s");
        if (failed) {
          failText = p.name + " has not opened after five minutes. Reload the page if it does not show up.";
          clearTimeout(failTimer);
          failTimer = setTimeout(() => { failText = ""; render(); }, FAIL_SHOW_MS);
        } else if (ms >= SHOW_AFTER_MS) {
          sayDone(p.name, ms);		// (one that took so little that the bar never showed it needs no message)
        }
        if (!pending.size) {
          clearInterval(timer);
          timer = 0;
          if (title0 !== null) {
            document.title = title0;
            title0 = null;
          }
        }
        render();
      };
      const tick = () => {
        const now = performance.now();
        for (const [appId, p] of [...pending]) {
          if (windowsOf(appId) > p.windows) {
            finish(appId, "window");
          } else if (now - p.at > GIVE_UP_MS) {
            finish(appId, "no window, given up", true);
          }
        }
        if (document.hidden && pending.size) {
          if (title0 === null) {
            title0 = document.title;
          }
          document.title = "Starting " + [...pending.values()].map((p) => p.name).join(", ") + "... " + title0;
        } else if (title0 !== null) {
          document.title = title0;
          title0 = null;
        }
        render();
      };
      const listen = () => {
        if (typeof window.rvChannel != "function") {
          return;
        }
        const channel = window.rvChannel("rv-plasma");
        channel.addEventListener("message", (event) => {
          const m = event.data;
          if (!m || typeof m.appId != "string") {
            return;
          }
          if (m.type === "launch") {
            const log = window.linuxOs && window.linuxOs.dl && window.linuxOs.dl.log;
            pending.set(m.appId, { name: nameOf(m.appId), at: performance.now(), windows: windowsOf(m.appId), logAt: log ? log.length : 0 });
            console.log("[Launch]: " + nameOf(m.appId) + " asked for by the launcher");
            if (!timer) {
              timer = setInterval(tick, 1000);
            }
          } else if (m.type === "launch-done") {
            // (the window server saw a window of the app, or gave the launch up: the tick looks at the windows itself)
            // (it also ends a launch it gave up, after five minutes: that is no "Launched")
            setTimeout(() => {
              const p = pending.get(m.appId);
              finish(m.appId, "window server: done", !!p && performance.now() - p.at >= GIVE_UP_MS - 5000);
            }, 0);
          }
        });
      };
      window.rvLaunching = () => pending.size > 0;
      document.addEventListener("DOMContentLoaded", listen);
    })();
  </script>
  <script>
    // The browser can take this site's storage away while the page is open (Chrome does it to a Guest or private window
    // when it is short of room or the data is removed; the person can clear the site's data): then every disk's files,
    // the person's own among them, are gone. The disks (disk-worker.js) and the store of translations (jitcache.js) go
    // on from memory and say so on the BroadcastChannel "rvwasm-storage" ({ type: "lost", disk, at, keep, kept, gone };
    // { type: "nospace", disk }); a look at the directories of the disks every few seconds (storageWatch, from the page
    // that knows their names) is the other way to learn it, and is the only one when the files are on a disk that the
    // browser unlinked (an open file goes on working: nothing is written that will be there next time). The note is the
    // same in all cases, and once.
    (() => {
      let shown = false;
      window.storageNote = (info) => {
        if (shown) {
          return;
        }
        const el = document.getElementById("storagenote");
        const text = document.getElementById("storagenote-text");
        if (!el || !text) {
          return;
        }
        shown = true;
        const at = new Date(info && info.at || Date.now());
        const time = at.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        text.textContent = "The browser removed this site's storage at " + time + ": your files since then are not saved. " +
          "This machine goes on from memory, and closing or reloading this tab starts it again from scratch. " +
          (info && info.gone ? "Some files from before could not be kept. " : "") +
          "(Guest and private windows get little storage, and a browser can take it back.)";
        el.hidden = false;
        console.log("[Storage]: the browser removed this site's storage at " + time + (info && info.reason ? " (" + info.reason + ")" : ""));
      };
      if (typeof BroadcastChannel == "function") {
        const channel = new BroadcastChannel("rvwasm-storage");
        channel.onmessage = (event) => {
          if (event.data && event.data.type == "lost") {
            window.storageNote(event.data);
          }
        };
      }
      // Look every 10 s whether the directories of these disks (their names, as the page gave them to the disk workers) are
      // still in the origin's private file system, once each has been seen there.
      window.storageWatch = (names) => {
        if (!navigator.storage || !navigator.storage.getDirectory) {
          return;
        }
        const seen = new Set();
        const look = async () => {
          try {
            const root = await navigator.storage.getDirectory();
            for (const name of names) {
              try {
                await root.getDirectoryHandle("disk-" + name);
                seen.add(name);
              } catch (error) {
                if (error.name == "NotFoundError" && seen.has(name)) {
                  window.storageNote({ at: Date.now(), reason: "the directory of the disk " + name + " is gone" });
                  return;
                }
              }
            }
          } catch (error) {
            // (No file system to look at: nothing to say.)
          }
        };
        const timer = setInterval(() => {
          if (!shown) {
            look();
          } else {
            clearInterval(timer);
          }
        }, 10000);
      };
    })();
  </script>
  <script src="linux.js"></script>
  <!-- The store of translated code that every process shares and this browser keeps (jitcache.js). -->
  <script src="jitcache.js"></script>
  <script src="xterm.js"></script>
  <!-- The windows of the machine's Wayland clients, over the screen, when its window server runs (wlserver/). -->
  <script src="display.js"></script>
  <script src="gpu-exec.js"></script>
  <!-- Guest players' video decoded by this browser's WebCodecs (vdec.js; ?vdec=off). -->
  <script src="vdec.js"></script>
  <!-- Web addresses from the machine, opened in this browser (hostopen/: rv-host-open, xdg-open). -->

  <script src="background.js"></script>
  <script>
    const variant = "wasm64_nommu";
    const version = +new Date();   // never serve stale kernels or initramfs from cache
    let output = "";
    let os = null;
    let resolveReady;
    window.linuxReady = new Promise((resolve) => { resolveReady = resolve; });
    window.linuxLog = [];

    // Run one shell command. The marker is printed by the shell after the command, with
    // its exit status; the echoed command line has "$?" there instead of digits.
    window.linuxRun = (command, timeoutMs = 30000) => new Promise((resolve) => {
      const marker = "__rc" + Math.random().toString(36).slice(2) + "_";
      const start = output.length;
      const pattern = new RegExp(marker + "(\\d+)");
      const began = performance.now();
      os.key_input(command + "; echo " + marker + "$?\r");
      const timer = setInterval(() => {
        const text = output.slice(start);
        const match = text.match(pattern);
        const elapsed = performance.now() - began;
        if (!match && elapsed < timeoutMs) {
          return;
        }
        clearInterval(timer);
        // Drop the echo of what we typed (everything up to the first line break).
        let out = match ? text.slice(0, match.index) : text;
        out = out.slice(out.indexOf("\n") + 1).replace(/\r/g, "");
        resolve({ rc: match ? Number(match[1]) : null, ms: Math.round(elapsed), out: out });
      }, 20);
    });

    // The main thread says what it is doing, for a thread that watches it (watchdog.js, which says why): a count
    // that goes up while it runs, and which call into the browser it is in, for the calls that can take long.
    {
      const words = new Int32Array(new SharedArrayBuffer(16));
      const mark = (object, name, code) => {
        const real = object[name];
        object[name] = function (...args) {
          const before = words[1];
          words[1] = code;
          try {
            return real.apply(this, args);
          } finally {
            words[1] = before;
          }
        };
      };
      mark(CanvasRenderingContext2D.prototype, "putImageData", 1);
      mark(HTMLCanvasElement.prototype, "toDataURL", 6);
      mark(Worker.prototype, "postMessage", 2);
      mark(Worker.prototype, "terminate", 7);
      mark(Atomics, "notify", 8);
      // And which message from a worker it is answering (linux.js: message_callbacks), by its place in this list.
      const methods = ["", "start_primary", "start_secondary", "stop_secondary", "create_and_run_task", "release_task",
                       "serialize_tasks", "console_read", "fb_show", "net_tx", "console_write", "log", "ready", "failed"];
      const handler = Object.getOwnPropertyDescriptor(Worker.prototype, "onmessage");
      Object.defineProperty(Worker.prototype, "onmessage", {
        configurable: true,
        get() {
          return handler.get.call(this);
        },
        set(f) {
          handler.set.call(this, typeof f != "function" ? f : function (event) {
            const at = methods.indexOf(event.data && event.data.method);
            words[3] = at < 0 ? 99 : at;
            try {
              return f.call(this, event);
            } finally {
              words[3] = 0;
            }
          });
        },
      });
      mark(WebSocket.prototype, "send", 3);
      if (window.Terminal) {
        mark(Terminal.prototype, "write", 5);
      }
      const RealWorker = Worker;
      window.Worker = function (...args) {
        const before = words[1];
        words[1] = 4;
        try {
          return new RealWorker(...args);
        } finally {
          words[1] = before;
        }
      };
      window.Worker.prototype = RealWorker.prototype;
      const frame = window.requestAnimationFrame.bind(window);
      window.requestAnimationFrame = (callback) => frame((time) => {
        words[2] = 1;
        try {
          callback(time);
        } finally {
          words[2] = 0;
        }
      });
      // (The count goes up when the watching thread asks, by a message: a timer of a page that is not in front
      // runs once a minute, and that is not the main thread standing still.)
      const watchdog = new RealWorker("watchdog.js?v=" + version, { name: "watchdog" });
      watchdog.addEventListener("message", () => Atomics.add(words, 0, 1));
      watchdog.postMessage({ words: words });
    }

    // Type into the terminal, without waiting for anything (tools/desktop-drive.js).
    window.linuxType = (text) => os.key_input(text);

    document.addEventListener("DOMContentLoaded", async () => {
      const term = new Terminal({ cols: 120, rows: 30 });
      term.open(document.getElementById("terminal"));
      const log = (text) => {
        window.linuxLog.push(text);
        term.write(("\x1B[2m" + text + "\x1B[0m\n").replaceAll("\n", "\r\n"));
      };
      const console_write = (data) => {
        output += data;
        term.write(data);
        if (resolveReady && output.endsWith("# ")) {
          resolveReady(true);
          resolveReady = null;
        }
      };
      try {
        const vmlinux = await WebAssembly.compileStreaming(fetch("vmlinux-" + variant + ".wasm?v=" + version));
        const pool_param = new URLSearchParams(location.search).get("pool");

              fetchJson: async (url) => (await fetch(url)).json(),
              sleep: (ms) => new Promise((resolve) => setTimeout(resolve, ms)),
              now: () => performance.now(),
              hidden: () => document.hidden,
              display: () => (window.rvDisplay && window.rvDisplay.stats
                              ? { bytes: window.rvDisplay.stats.uploadBytes, windows: window.rvDisplay.stats.windows } : null),
              keepBelow: keep === null ? DL_BACKGROUND_KEEP_BELOW : Number(keep),
              log,
            }).catch((error) => log("[Dl]: background compile stopped (" + error.message + ")"));
          });
        }
      } catch (error) {
        log("Linux/Wasm failed with (" + error.name + "): " + error.message + "\n" + error.stack);
        throw error;
      }
    });
  </script>
</head>
<body>
  <!-- Says that the relay has this machine wait for the network, see netBanner in the head; hidden otherwise. -->
  <div id="netbanner" role="status" aria-live="polite" hidden></div>
  <!-- Says that the browser removed this site's storage, see storageNote in the head; hidden otherwise. -->
  <div id="storagenote" role="alert" hidden>
    <span id="storagenote-text"></span>
    <button type="button" onclick="document.getElementById('storagenote').hidden = true">OK</button>
  </div>
  <!-- The machine's display (click it to give it the keyboard), and below it the serial console. -->
  <canvas id="screen" tabindex="0" width="1024" height="768"
          style="display: block; max-width: 100%; background: #000; outline: none; margin-bottom: 8px;"></canvas>
  <div id="display"></div>
  <div id="terminal" tabindex="0"></div>
</body>
